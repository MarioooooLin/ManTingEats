services:
  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=db;Port=3306;Database=ManTingEatsDb;User=mantingeats_app;Password=apppassword;"
    # 等資料庫健康檢查通過才啟動：網站啟動時會立即執行 Migration，資料庫未就緒會直接失敗退出
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ManTingEatsDb
      # 應用程式連線用的最小權限帳號，僅授權於 ManTingEatsDb（由官方 image 自動建立）
      MYSQL_USER: mantingeats_app
      MYSQL_PASSWORD: apppassword
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    # 以網站實際使用的帳號、經 TCP 連線查詢資料庫才算健康：
    # MySQL 首次初始化時會先啟動只接受 socket 連線的暫時伺服器，單純 mysqladmin ping 會在此時誤判為就緒。
    # 密碼取自容器內的環境變數（$$ 讓 Compose 不展開），不寫進健康檢查指令本身。
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" -e 'SELECT 1' \"$$MYSQL_DATABASE\" > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
      start_interval: 2s

volumes:
  mysql-data: